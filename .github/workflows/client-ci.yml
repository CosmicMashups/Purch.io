name: client-ci

on:
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"
  push:
    branches: [main]
    paths:
      - "client/**"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      # - run: flutter test
      #   (enabled once Phase 1 lands real code/tests — an empty scaffold has none yet)
