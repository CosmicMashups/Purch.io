name: client-ci

on:
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"
  push:
    branches: [main]
    paths:
      - "client/**"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Drift and Riverpod both use code generation (.g.dart files are gitignored,
      # regenerated on every checkout) - must run before analyze/test can see them.
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
