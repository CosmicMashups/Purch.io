# -Xmx8G assumes a 16GB+ machine; on a machine with less headroom the Gradle
# daemon's JVM can fail a native memory allocation and crash outright rather
# than degrading gracefully (observed as "Gradle build daemon disappeared
# unexpectedly" with a JVM hs_err crash log citing a failed G1 heap mmap).
# 3G is comfortably enough to build this project and leaves room for the
# concurrent Kotlin daemon, D8/R8, and AAPT2 JVMs Gradle also spins up.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# The project lives on a different drive letter than the Pub Cache
# (%LOCALAPPDATA%\Pub\Cache, on C:) on this machine. Kotlin's incremental
# compiler tries to compute a path relative between the two and throws
# "this and base files have different roots" — a known Kotlin/Windows
# cross-drive bug, not a real compile error. Incremental compilation is
# only a rebuild-speed optimization, so disabling it just makes every
# build a clean compile instead of crashing outright.
kotlin.incremental=false
